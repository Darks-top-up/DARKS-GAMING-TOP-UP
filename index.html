<!-- GAMER ID + RECEIPT MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>

<div class="modal" id="gamerModal">

  <h3 id="modalTitle">Enter Gamer Info</h3>

  <p id="modalDesc">
    Enter your Gamer ID or Username and optionally upload your payment receipt.
  </p>

  <label style="
    display:block;
    font-size:12px;
    font-weight:800;
    color:#aeb8c7;
    margin-bottom:7px;
  ">
    Gamer ID / Username
  </label>

  <input
    type="text"
    id="gamerIdInput"
    placeholder="e.g. Player123 or ID #12345678"
  >

  <label style="
    display:block;
    font-size:12px;
    font-weight:800;
    color:#aeb8c7;
    margin-bottom:7px;
  ">
    Payment Receipt
    <span style="color:#788597;font-weight:500;">
      (Optional)
    </span>
  </label>

  <input
    type="file"
    id="receiptInput"
    accept="image/*"
    style="
      padding:10px;
      cursor:pointer;
    "
  >

  <div style="
    font-size:11px;
    color:#687586;
    margin-top:-10px;
    margin-bottom:18px;
    line-height:1.5;
  ">
    Upload a screenshot/photo of your payment receipt.
    The receipt image will need to be sent directly in WhatsApp.
  </div>

  <div class="modal-actions">

    <button
      class="btn btn-secondary"
      onclick="closeModal()"
    >
      Cancel
    </button>

    <button
      class="btn btn-primary"
      onclick="confirmAddToCart()"
    >
      Add & Order
    </button>

  </div>

</div>


<div class="toast" id="toast"></div>


<script>

let cart = [];
let pendingItem = null;

const products = document.querySelectorAll(".product");


/* =========================
   MOBILE MENU
========================= */

function toggleMenu(){
  document.getElementById("nav").classList.toggle("open");
}


/* =========================
   SEARCH
========================= */

function focusSearch(){

  const search = document.getElementById("searchInput");

  document.getElementById("gaming").scrollIntoView({
    behavior:"smooth"
  });

  setTimeout(()=>{
    search.focus();
  },500);
}


/* =========================
   FILTER PRODUCTS
========================= */

function filterProducts(game,button){

  document.querySelectorAll(".filter").forEach(btn=>{
    btn.classList.remove("active");
  });

  button.classList.add("active");

  products.forEach(product=>{

    if(
      game === "all" ||
      product.dataset.game === game
    ){
      product.style.display = "";
    }else{
      product.style.display = "none";
    }

  });

  document.getElementById("searchInput").value = "";
}


/* =========================
   SEARCH PRODUCTS
========================= */

function searchProducts(){

  const query =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();

  products.forEach(product=>{

    const name =
      product.dataset.name.toLowerCase();

    product.style.display =
      name.includes(query) ? "" : "none";

  });
}


/* =========================
   OPEN GAMER ID MODAL
========================= */

function promptGamerId(name, price, image){

  pendingItem = {
    name: name,
    price: price,
    image: image
  };

  document.getElementById("modalTitle").textContent =
    "Top-up: " + name;

  document.getElementById("gamerIdInput").value = "";

  // Clear previous receipt
  document.getElementById("receiptInput").value = "";

  document
    .getElementById("gamerModal")
    .classList.add("open");

  document
    .getElementById("modalOverlay")
    .classList.add("open");

  setTimeout(()=>{

    document
      .getElementById("gamerIdInput")
      .focus();

  },100);
}


/* =========================
   CLOSE MODAL
========================= */

function closeModal(){

  document
    .getElementById("gamerModal")
    .classList.remove("open");

  document
    .getElementById("modalOverlay")
    .classList.remove("open");

  pendingItem = null;
}


/* =========================
   CONFIRM ORDER
========================= */

function confirmAddToCart(){

  if(!pendingItem){

    showToast("Please select a package first.");

    return;
  }

  const gamerId =
    document
      .getElementById("gamerIdInput")
      .value
      .trim();

  const fileInput =
    document.getElementById("receiptInput");

  const file =
    fileInput.files[0];


  /* Gamer ID required */

  if(!gamerId){

    showToast(
      "Please enter your Gamer ID or Username!"
    );

    return;
  }


  /*
    If receipt was uploaded,
    convert it to Data URL.
  */

  if(file){

    // Only allow images
    if(!file.type.startsWith("image/")){

      showToast(
        "Please upload an image receipt."
      );

      return;
    }


    const reader = new FileReader();


    reader.onload = function(e){

      saveAndOrder(
        gamerId,
        e.target.result,
        file.name
      );

    };


    reader.onerror = function(){

      showToast(
        "Could not read the receipt image."
      );

    };


    reader.readAsDataURL(file);


  }else{

    // No receipt uploaded

    saveAndOrder(
      gamerId,
      null,
      null
    );

  }
}


/* =========================
   SAVE ITEM + ORDER
========================= */

function saveAndOrder(
  gamerId,
  receiptDataUrl,
  fileName
){

  if(!pendingItem){

    showToast("Something went wrong.");

    return;
  }


  const newItem = {

    name: pendingItem.name,

    price: pendingItem.price,

    image: pendingItem.image,

    gamerId: gamerId,

    receipt: receiptDataUrl,

    receiptName: fileName

  };


  cart.push(newItem);


  closeModal();


  updateCart();


  showToast(
    "Added to cart ✓"
  );


  /*
    Automatically open WhatsApp
    for the newly selected item.
  */

  sendWhatsAppOrder(newItem);
}


/* =========================
   REMOVE FROM CART
========================= */

function removeFromCart(index){

  cart.splice(index,1);

  updateCart();
}


/* =========================
   UPDATE CART
========================= */

function updateCart(){

  const container =
    document.getElementById("cartItems");

  const count =
    document.getElementById("cartCount");

  const total =
    document.getElementById("cartTotal");


  count.textContent =
    cart.length;


  if(cart.length === 0){

    container.innerHTML =
      '<div class="empty">Your cart is empty.</div>';

    total.textContent =
      "GYD 0";

    return;
  }


  let sum = 0;


  container.innerHTML =
    cart.map((item,index)=>{

      sum += item.price;


      const hasReceipt =
        item.receiptName
        ?
        `
        <div style="
          font-size:10px;
          color:#00ff95;
          margin-top:3px;
          font-weight:800;
        ">
          Receipt Attached ✓
        </div>
        `
        :
        "";


      return `

        <div class="cart-item">

          <img
            src="${item.image}"
            alt="${item.name}"
          >

          <div>

            <h4>
              ${item.name}
            </h4>

            <div class="cart-uid">
              ID: ${item.gamerId}
            </div>

            ${hasReceipt}

            <p>
              GYD ${item.price.toLocaleString()}
            </p>

          </div>

          <button
            class="remove"
            onclick="removeFromCart(${index})"
          >
            ✕
          </button>

        </div>

      `;

    }).join("");


  total.textContent =
    "GYD " + sum.toLocaleString();
}


/* =========================
   OPEN CART
========================= */

function openCart(){

  document
    .getElementById("cart")
    .classList.add("open");

  document
    .getElementById("cartOverlay")
    .classList.add("open");
}


/* =========================
   CLOSE CART
========================= */

function closeCart(){

  document
    .getElementById("cart")
    .classList.remove("open");

  document
    .getElementById("cartOverlay")
    .classList.remove("open");
}


/* =========================
   TOAST
========================= */

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent =
    message;

  toast.classList.add("show");


  setTimeout(()=>{

    toast.classList.remove("show");

  },2000);
}


/* =========================
   WHATSAPP SINGLE ORDER
========================= */

function sendWhatsAppOrder(item){

  let messageText =
    "Hi DARK! I'd like to place an order:\n\n" +

    "• " +
    item.name +
    " — GYD " +
    item.price.toLocaleString() +
    "\n" +

    "👤 Gamer ID / Username: " +
    item.gamerId +
    "\n";


  /*
    If receipt exists,
    include receipt filename.
  */

  if(item.receiptName){

    messageText +=
      "📎 Payment Receipt Attached: " +
      item.receiptName +
      "\n" +

      "I will send the receipt image directly in this chat.\n";
  }


  messageText +=
    "\n" +

    "Total: GYD " +
    item.price.toLocaleString() +

    "\n\n" +

    "Please send me the payment instructions/confirmation.";


  const message =
    encodeURIComponent(messageText);


  window.open(
    "https://wa.me/13436555995?text=" +
    message,
    "_blank"
  );
}


/* =========================
   CHECKOUT MULTIPLE ITEMS
========================= */

function checkout(){

  if(cart.length === 0){

    showToast(
      "Your cart is empty."
    );

    return;
  }


  let receiptNames = [];


  const items = cart.map(item=>{

    if(item.receiptName){

      receiptNames.push(
        item.receiptName
      );

    }


    return (
      "• " +
      item.name +
      " — GYD " +
      item.price.toLocaleString() +
      " (ID: " +
      item.gamerId +
      ")"
    );

  }).join("\n");


  const total =
    cart.reduce(
      (sum,item)=>
        sum + item.price,
      0
    );


  let messageText =
    "Hi DARK! I'd like to place an order for multiple items:\n\n" +

    items +

    "\n\n" +

    "Total: GYD " +
    total.toLocaleString();


  if(receiptNames.length > 0){

    messageText +=
      "\n\n📎 Payment Receipt(s):\n" +
      receiptNames.join("\n") +
      "\n\n" +
      "I will send the receipt image(s) directly in this WhatsApp chat.";

  }


  messageText +=
    "\n\nPlease send me the payment instructions/confirmation.";


  const message =
    encodeURIComponent(messageText);


  window.open(
    "https://wa.me/13436555995?text=" +
    message,
    "_blank"
  );
}


/* =========================
   INITIAL CART
========================= */

updateCart();

  </script>
