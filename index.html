<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1400, initial-scale=0.3">
  <title>DARK - Digital Entertainment & Gaming Hub</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #05070a;
      color: #e6edf3;
      overflow-x: auto;
      min-width: 1400px;
    }

    /* NAVIGATION */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 60px;
      background: rgba(10, 14, 23, 0.85);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid #1f293d;
      min-width: 1400px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-infinity {
      font-size: 32px;
      background: linear-gradient(135deg, #00f2fe, #4facfe, #00c6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: bold;
    }

    .logo-text {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #fff;
      text-shadow: 0 0 10px rgba(255,255,255,.3);
    }

    nav {
      display: flex;
      gap: 30px;
    }

    nav a {
      color: #8b949e;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      transition: color .3s;
    }

    nav a:hover,
    nav a.active {
      color: #38bdf8;
    }

    .header-actions {
      display: flex;
      gap: 25px;
      color: #8b949e;
      font-size: 16px;
      cursor: pointer;
    }

    .header-actions span:hover {
      color: #fff;
    }

    /* HERO */
    .hero {
      position: relative;
      padding: 110px 20px 130px;
      text-align: center;
      background: radial-gradient(
        circle at center,
        rgba(14,116,144,.18) 0%,
        rgba(5,7,10,1) 75%
      );
      border-bottom: 1px solid #161e2e;
      overflow: hidden;
    }

    .hero-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%,-50%);
      width: 800px;
      height: 350px;
      background: radial-gradient(
        circle,
        rgba(6,182,212,.25) 0%,
        rgba(0,0,0,0) 70%
      );
      pointer-events: none;
    }

    .hero h1 {
      font-size: 56px;
      font-weight: 900;
      letter-spacing: 3px;
      margin-bottom: 16px;
      color: #fff;
    }

    .hero p {
      color: #94a3b8;
      font-size: 20px;
      margin-bottom: 35px;
    }

    .hero-buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .btn {
      padding: 14px 36px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all .3s;
      text-decoration: none;
    }

    .btn-glow-blue {
      background: transparent;
      color: #38bdf8;
      border: 1px solid #0284c7;
      box-shadow: 0 0 18px rgba(2,132,199,.35);
    }

    .btn-glow-blue:hover {
      background: #0284c7;
      color: #fff;
      box-shadow: 0 0 30px rgba(2,132,199,.7);
    }

    /* SECTIONS */
    .section-container {
      max-width: 1400px;
      margin: 60px auto;
      padding: 0 30px;
    }

    .section-title {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 35px;
      color: #f1f5f9;
    }

    /* CATEGORIES */
    .categories-grid {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 25px;
    }

    .cat-card {
      background: #0b0f17;
      border-radius: 14px;
      padding: 30px 25px;
      text-align: center;
      transition: all .3s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 250px;
    }

    .cat-card.blue {
      border: 1px solid rgba(14,165,233,.3);
      box-shadow: 0 0 15px rgba(14,165,233,.05);
    }

    .cat-card.blue:hover {
      border-color: #38bdf8;
      box-shadow: 0 0 25px rgba(56,189,248,.3);
      transform: translateY(-5px);
    }

    .cat-card.green {
      border: 1px solid rgba(34,197,94,.3);
      box-shadow: 0 0 15px rgba(34,197,94,.05);
    }

    .cat-card.green:hover {
      border-color: #4ade80;
      box-shadow: 0 0 25px rgba(74,222,128,.3);
      transform: translateY(-5px);
    }

    .cat-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .cat-card h3 {
      font-size: 20px;
      margin-bottom: 10px;
      color: #f8fafc;
    }

    .cat-card p {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    /* SLIDERS */
    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .slider-controls {
      display: flex;
      gap: 12px;
    }

    .slider-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: .2s;
    }

    .slider-btn:hover {
      background: #0284c7;
      border-color: #38bdf8;
    }

    .cards-slider-wrapper {
      overflow-x: auto;
      scroll-behavior: smooth;
      scrollbar-width: none;
      padding: 12px 0;
    }

    .cards-slider-wrapper::-webkit-scrollbar {
      display: none;
    }

    .cards-slider {
      display: flex;
      gap: 25px;
    }

    /* GAME CARDS */
    .game-card {
      min-width: 240px;
